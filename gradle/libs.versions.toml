[versions]
palantir = "2.102.0"
publishdata = "2.2.0"
vanniktech = "0.37.0"
spotless = "8.10.4"
freefair = "9.8.2"
jda = "6.7.0"
jdacommands = "5.1.1"
jackson = "3.2.4"
jackson-annotations = "2.22"
javalin = "7.2.3"
guava = "33.7.2-jre"
httpclient = "5.6.5"
angus = "2.0.5"
commons-validator = "1.11.0"
slf4j = "2.0.20"
jspecify = "1.0.1"
junit = "6.1.3"
mockito = "5.24.0"

[libraries]
jda = { module = "net.dv8tion:JDA", version.ref = "jda" }
jdacommands = { module = "io.github.kaktushose:jda-commands", version.ref = "jdacommands" }
jackson-core = { module = "tools.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson-annotations" }
javalin = { module = "io.javalin:javalin", version.ref = "javalin" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
httpclient = { module = "org.apache.httpcomponents.client5:httpclient5", version.ref = "httpclient" }
angus-mail = { module = "org.eclipse.angus:angus-mail", version.ref = "angus" }
commons-validator = { module = "commons-validator:commons-validator", version.ref = "commons-validator" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }

# buildSrc classpath only
gradle-publishdata = { module = "de.chojo:publishdata", version.ref = "publishdata" }
gradle-vanniktech = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "vanniktech" }
gradle-spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[plugins]
aggregate-javadoc = { id = "io.freefair.aggregate-javadoc", version.ref = "freefair" }
